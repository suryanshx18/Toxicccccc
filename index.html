<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOXIC BY OHHO CRICKET</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      min-height: 100vh;
    }

    /* Telegram Popup */
    .popup {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .popup-box {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 0 35px rgba(0,0,0,0.8);
    }

    .popup-box h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .popup-box p {
      color: #bbb;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .telegram-btn {
      display: inline-block;
      background: #229ED9;
      color: white;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-weight: bold;
      margin: 5px;
    }

    .close-btn {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px;
    }

    /* Main Website */
    header {
      text-align: center;
      padding: 35px 15px 20px;
    }

    header h1 {
      font-size: clamp(28px, 7vw, 55px);
      font-weight: 900;
      letter-spacing: 2px;
    }

    header p {
      color: #999;
      margin-top: 8px;
    }

    .container {
      width: 92%;
      max-width: 1000px;
      margin: 25px auto 60px;
    }

    .video-card {
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 15px;
      overflow: hidden;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .video-title {
      padding: 18px 5px 5px;
      font-size: 20px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      color: #666;
      padding: 25px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- TELEGRAM JOIN POPUP -->
  <div class="popup" id="telegramPopup">
    <div class="popup-box">
      <h1>📢 JOIN OUR TELEGRAM</h1>

      <p>
        Join <b>OHHO CRICKET</b> on Telegram for updates and new videos.
      </p>

      <a
        class="telegram-btn"
        href="https://t.me/OHHOCRICKET"
        target="_blank"
      >
        JOIN TELEGRAM
      </a>

      <br>

      <button class="close-btn" onclick="closePopup()">
        Continue to Website
      </button>
    </div>
  </div>

  <!-- WEBSITE HEADER -->
  <header>
    <h1>TOXIC BY OHHO CRICKET</h1>
    <p>Official Video Portal</p>
  </header>

  <!-- VIDEO -->
  <main class="container">
    <div class="video-card">

      <div class="video-wrapper">
        <video id="mainVideo" controls playsinline poster="">
          Your browser does not support HTML5 video.
        </video>
      </div>

      <div class="video-title">
        TOXIC BY OHHO CRICKET
      </div>

    </div>
  </main>

  <footer>
    © 2026 TOXIC BY OHHO CRICKET
  </footer>


  <script>

    /*
      ==============================
      PUT YOUR VIDEO LINK HERE
      ==============================

      Example:
      const VIDEO_URL = "https://filetolinkkk-77971a19d2f8.herokuapp.com/184938/TOXiC.2026.1080p.HDTC.Hindi-Line.HC-ESub.x264.mkv?hash=AgADxy";

      The link should point directly to a video file
      such as .mp4 if you are using the HTML5 video player.
    */

    const VIDEO_URL = "https://filetolinkkk-77971a19d2f8.herokuapp.com/184938/TOXiC.2026.1080p.HDTC.Hindi-Line.HC-ESub.x264.mkv?hash=AgADxy";

    document.getElementById("mainVideo").src = VIDEO_URL;


    // Telegram popup
    function closePopup() {
      document.getElementById("telegramPopup").style.display = "none";
    }

  </script>

</body>
</html>
